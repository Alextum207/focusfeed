name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen && xcodegen
      - name: Test
        run: >
          xcodebuild test -project FocusFeed.xcodeproj -scheme FocusFeed
          -destination 'platform=iOS Simulator,name=iPhone 15' CODE_SIGNING_ALLOWED=NO
      - name: Build unsigned IPA
        run: |
          xcodebuild build -project FocusFeed.xcodeproj -scheme FocusFeed -sdk iphoneos \
            -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO
          mkdir Payload && cp -R build/Build/Products/Release-iphoneos/FocusFeed.app Payload/
          zip -r FocusFeed.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: FocusFeed-ipa, path: FocusFeed.ipa }
